    // Robust Markdown & Table Renderer for Sample Output
    function SampleOutputRenderer({ text }) {
      if (!text) return null;

      const lines = text.split('\n');
      const elements = [];
      let inTable = false;
      let tableRows = [];

      function renderTable(rows, key) {
        if (!rows || rows.length < 2) return null;
        const headerCols = rows[0].split('|').map(s => s.trim()).filter(Boolean);
        const bodyRows = rows.slice(2).map(r => r.split('|').map(s => s.trim()).filter(Boolean));

        return (
          <div key={key} className="my-3 overflow-x-auto rounded-lg border border-slate-200">
            <table className="min-w-full divide-y divide-slate-200 text-xs text-left">
              <thead className="bg-baac-50 text-baac-900 font-bold">
                <tr>
                  {headerCols.map((h, i) => (
                    <th key={i} className="px-3 py-2 border-r last:border-r-0 border-slate-200">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody className="bg-white divide-y divide-slate-100">
                {bodyRows.map((cols, rIdx) => (
                  <tr key={rIdx} className="hover:bg-slate-50">
                    {cols.map((c, cIdx) => (
                      <td key={cIdx} className="px-3 py-2 border-r last:border-r-0 border-slate-100 text-slate-700">{c}</td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
          inTable = true;
          tableRows.push(line);
        } else {
          if (inTable) {
            elements.push(renderTable(tableRows, `table-${i}`));
            tableRows = [];
            inTable = false;
          }
          if (line.startsWith('## ')) {
            elements.push(<h2 key={i} className="text-sm font-bold text-baac-900 mt-3 mb-1">{line.replace('## ', '')}</h2>);
          } else if (line.startsWith('### ')) {
            elements.push(<h3 key={i} className="text-xs font-bold text-baac-800 mt-2 mb-1">{line.replace('### ', '')}</h3>);
          } else if (line.startsWith('- ')) {
            elements.push(<li key={i} className="ml-4 text-xs text-slate-700 list-disc">{line.replace('- ', '')}</li>);
          } else if (line.trim()) {
            elements.push(<p key={i} className="text-xs text-slate-700 leading-relaxed mb-1.5">{line}</p>);
          }
        }
      }
      if (inTable) {
        elements.push(renderTable(tableRows, `table-end`));
      }

      return <div className="font-sarabun">{elements}</div>;
    }

    // Interactive Zero-API Mini-App Simulator for Canvas Demos
    function InteractiveCanvasDemo({ app }) {
      const deptCode = app.deptCode;

      // State for different mini-app simulations
      const [kpiScore, setKpiScore] = useState(88);

      const [eodChecks, setEodChecks] = useState([true, true, true, false]);
      const [cashWithdrawal, setCashWithdrawal] = useState(4500000);
      const [spinError, setSpinError] = useState("ERR-SPIN-9021");
      const [swiftInput, setSwiftInput] = useState(":20:TRF20260912\n:32A:260912USD50000,\n:50K:BAAC THAI FARMER\n:59:EXPORT CO LTD");
      const [chequeCode, setChequeCode] = useState("01");
      const [reconFilter, setReconFilter] = useState("all");
      const [atmIssue, setAtmIssue] = useState("card_stuck");

      const [atmCashPct, setAtmCashPct] = useState(25);

      // Dept 01 Demo: KPI Tracker
      if (deptCode === "01") {
        const statusColor = kpiScore >= 100 ? "text-emerald-600 bg-emerald-50" : kpiScore >= 80 ? "text-amber-600 bg-amber-50" : "text-rose-600 bg-rose-50";

      // Dept 02 Demo: BRD User Story & Test Case

            <div className="font-bold text-slate-800 text-sm">📝 ตัวอย่าง User Story & Test Cases อัตโนมัติ</div>
            <div className="bg-blue-50 text-blue-900 p-2.5 rounded-lg border border-blue-200 leading-relaxed">
              <strong>User Story:</strong> ในฐานะ "ผู้จัดการสาขา ธ.ก.ส." ฉันต้องการ "ดูรายงานเงินสดคงเหลือแยกตามตู้ ATM" เพื่อ "วางแผนสั่งเงินสดสำรองได้แม่นยำ"
            </div>

              </div>
              <div>
                <label className="block text-slate-600 mb-1">ประเภทเงินได้:</label>
                <select value={taxRate} onChange={(e) => setTaxRate(Number(e.target.value))} className="w-full p-2 border border-slate-300 rounded-lg text-xs bg-white">
                  <option value={3}>ค่าจ้างทำของ/บริการ (3%)</option>
                  <option value={1}>ค่าขนส่ง (1%)</option>
                  <option value={5}>ค่าเช่าทรัพย์สิน (5%)</option>
                </select>
              </div>
            </div>
            <div className="bg-emerald-50 border border-emerald-200 p-2.5 rounded-lg flex justify-between items-center text-xs">
              <div>ภาษีหัก ณ ที่จ่าย ({taxRate}%): <strong className="text-emerald-800 text-sm">{taxVal.toLocaleString()} บ.</strong></div>

            </div>
            <div className="pt-2 border-t border-slate-100">

                {["ตรวจเช็คเคลียริ่งคงค้าง", "กระทบยอดเงินสดหน้าเคาน์เตอร์", "ตรวจรายการโอน SPIN ค้างท่อ", "ส่งยอดปิดบัญชีสิ้นวัน"].map((txt, idx) => (
